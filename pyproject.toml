[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-sim-sdk"
version = "0.1.0"
description = "Healthcare Intervention Simulation SDK for AI deployment evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Michael Draugelis"},
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    # experiments/analysis/its.py (segmented regression, HAC errors)
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "jupyter>=1.0",
    "matplotlib>=3.5",
    "nbconvert>=7.0",
    "pyyaml>=6.0",
    # Statistical dependencies for monitoring validation (tiered dashboard)
    "scikit-learn>=1.3.0",
    "hydra-joblib-launcher>=1.2.0",
]
# Quality-gate tools. Exact versions and hashes live in requirements/lock.txt.
lint = [
    "flake8>=7.0",
    "ruff>=0.8",
]
build = [
    "build>=1.2",
    "setuptools>=68.0",
    "wheel>=0.43",
]

[tool.setuptools.packages.find]
include = ["healthcare_sim_sdk*"]

[tool.setuptools.package-data]
# Hydra configs and claim registries are loaded relative to their modules,
# so an installed wheel must carry them.
"*" = ["*.yaml"]

[tool.setuptools.exclude-package-data]
# Never package institution-private files, even from a dirty working copy.
# Config folders are namespace packages, so patterns are folder-relative.
# The quality gate also builds only from a git snapshot (scripts/quality_gate.sh).
"*" = [
    "*.private.yaml", "*.private.yml", "*.private.json", "*.private.md",
    "model_frozen.yaml", "model_targets.yaml",
]
"healthcare_sim_sdk.scenarios.malnutrition_prioritization.configs.campus" = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/lint_fixtures"]
markers = [
    "private: needs institution-private files (see tests/private_profile.py)",
]

# Flake8 reads .flake8, not this file.

[tool.ruff]
# Ruff runs only the targeted rules from issue #8; Flake8 runs style and
# pyflakes checks (see .flake8). Rationale and severities: docs/lint_rules.md.
target-version = "py310"
extend-exclude = ["tests/lint_fixtures"]

[tool.ruff.lint]
select = [
    "PT011",   # pytest.raises too broad (no match=)
    "PT012",   # pytest.raises block with more than one statement
    "B017",    # pytest.raises(Exception)
    "PT015",   # assert False / always-failing assert
    "B011",    # assert False (stripped under -O)
    "PGH004",  # blanket # noqa
    "RUF100",  # unused # noqa
]
# Codes enforced by Flake8; RUF100 must not call their noqa comments unused.
external = ["E", "W", "F", "C90"]
