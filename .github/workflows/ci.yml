name: SDK validation
on: [push, pull_request]
jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor;
      # the gate uses one to run every check with network removed.
      - name: Allow network isolation for the gate
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Quality gate (docs/lint_rules.md)
        run: scripts/quality_gate.sh --require-offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate
          path: outputs/quality_gate/
