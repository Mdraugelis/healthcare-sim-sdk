repos:
  - repo: local
    hooks:
      - id: check-invariants
        name: SDK invariant checks
        entry: python scripts/check_invariants.py
        language: python
        # The hook reads config/invariants.yaml.
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false

      - id: no-bare-np-random
        name: No bare np.random calls
        entry: python scripts/check_no_bare_random.py
        language: python
        types: [python]
        pass_filenames: true

      - id: core-modification-warning
        name: Warn on core/ modifications
        entry: python scripts/check_core_modifications.py
        language: python
        always_run: true
        pass_filenames: false

      - id: no-institution-terms
        name: No institution-specific terms in staged files
        entry: python scripts/check_no_institution_terms.py
        language: python
        pass_filenames: true

      - id: no-institution-terms-msg
        name: No institution-specific terms in commit message
        entry: python scripts/check_no_institution_terms.py
        language: python
        stages: [commit-msg]
        pass_filenames: true

      # Issue #8 targeted lint. Uses the tools from the locked environment
      # (uv pip sync --require-hashes requirements/lock.txt). Full gate:
      # scripts/quality_gate.sh
      - id: sdk-lint
        name: sdk-lint (SDK001-SDK006)
        entry: python scripts/sdk_lint.py
        language: system
        types: [python]
        exclude: ^tests/lint_fixtures/
      - id: docs-check
        name: docs-check (DOC001-DOC009)
        entry: python scripts/check_docs.py
        language: system
        always_run: true
        pass_filenames: false
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
        exclude: ^tests/lint_fixtures/
      - id: ruff
        name: ruff (targeted rules)
        entry: ruff check --no-cache --force-exclude
        language: system
        types: [python]
