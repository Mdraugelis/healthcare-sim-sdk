# Calibration exercise. The published result was used to set these
# inputs, so the run cannot confirm that result. See AGENTS.md here.
#   python -m healthcare_sim_sdk.scenarios.paper05_composer.run_evaluation
seed: 42
n_patients: 5000
n_timesteps: 84                 # 4-hour blocks; 14 days
scenario:
  model_auc: 0.81               # assumed; the paper reports none
  treatment_effectiveness: 0.17
  bundle_compliance_boost: 0.05
  baseline_bundle_compliance: 0.50   # assumed
  sepsis_prevalence: 0.112           # assumed baseline mortality ~11%
  nurse_response_rate: 0.72

hydra:
  run:
    dir: outputs/paper05_composer/evaluation/${now:%Y%m%d_%H%M%S}
  sweep:
    dir: outputs/paper05_composer/evaluation/sweep_${now:%Y%m%d_%H%M%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
