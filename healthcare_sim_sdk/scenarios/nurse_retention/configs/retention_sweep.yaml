# Nurse retention: model quality (AUC) against manager capacity.
#
# There is no threshold dimension on purpose. Manager capacity is the
# threshold: each manager takes the top K nurses by predicted risk each
# week, so an absolute score cut would be dominated by capacity.
#
#   python -m healthcare_sim_sdk.scenarios.nurse_retention.run_evaluation
#   ... run_evaluation sweep=true                    # the full grid below
#   ... run_evaluation model_auc=0.75 max_interventions_per_manager_per_week=6
experiment_name: nurse_retention_evaluation
timestamp: ${now:%Y%m%d_%H%M%S}
seed: 42

# Population
n_nurses: 1000
nurses_per_manager: 100
annual_turnover_rate: 0.22
new_hire_fraction: 0.15
new_hire_risk_multiplier: 2.0

# Simulation
n_weeks: 52
ar1_rho: 0.95
ar1_sigma: 0.04
prediction_interval: 2          # score nurses every 2 weeks

# Model and policy for a single run (sweep: false)
model_auc: 0.80
max_interventions_per_manager_per_week: 4
intervention_effectiveness: 0.50
decay_halflife_weeks: 6.0
cooldown_weeks: 4

# sweep: false runs the single cell above. sweep: true runs the grid.
sweep: false
auc_grid: [0.60, 0.65, 0.70, 0.75]
capacity_grid: [2, 4, 6, 8]

# Parallel workers for the sweep. 0 = one per CPU, capped by the number
# of cells; 1 = sequential.
workers: 0

hydra:
  run:
    dir: outputs/nurse_retention/evaluation/${now:%Y%m%d_%H%M%S}
  sweep:
    dir: outputs/nurse_retention/evaluation/sweep_${now:%Y%m%d_%H%M%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
