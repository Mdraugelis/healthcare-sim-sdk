# @package _global_
# Regime E — Model Drift
# Model AUC drifts from 0.80 to 0.60 between weeks 20-40.
regime: model_drift
model:
  auc:
    base: 0.80
    change_points:
      - [20, 0.80]
      - [40, 0.60]
    interpolation: linear

# Windows are inclusive; the runner sets horizon to n_weeks - 1.
# Change week is the first discrete week whose parameter differs from baseline.
monitoring_claims:
  - claim_id: auc_loss_after_drift
    tier: 4
    metric: realized_auc
    direction: down
    change_week: 21
    eligibility_start: 21
