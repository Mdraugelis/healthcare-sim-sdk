# @package _global_
# Regime D — Capacity Collapse
# Capacity drops from 6 to 2 at week 30 (step change).
regime: capacity_collapse
policy:
  max_interventions_per_week:
    base: 6.0
    change_points:
      - [30, 2.0]
    interpolation: step

# Windows are inclusive; the runner sets horizon to n_weeks - 1.
monitoring_claims:
  - claim_id: capacity_loss
    tier: 1
    metric: check_ins_done
    direction: down
    change_week: 30
    eligibility_start: 30
