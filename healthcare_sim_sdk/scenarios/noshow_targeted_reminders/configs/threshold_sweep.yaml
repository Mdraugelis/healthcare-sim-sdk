# Threshold sweep with a published benchmark for comparison.
# Sweeps the probability threshold in the reminder-call decision across
# base no-show rates and model AUCs. One run covers the whole grid and
# writes one table.
#   python -m healthcare_sim_sdk.scenarios.noshow_targeted_reminders.run_threshold_sweep
#   ... run_threshold_sweep 'thresholds=[0.10,0.20]' n_days=30
experiment_name: threshold_sweep_ucsf_benchmark
seed: 42
n_patients: 5000
n_days: 90

# The grid.
base_noshow_rates: [0.09, 0.13, 0.18]
auc_targets: [0.72, 0.80, 0.85]
thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]

targeting_mode: threshold
call_capacity_per_day: 48      # set high so capacity does not bind
call_success_rate: 0.65
reminder_effectiveness: 0.35

# Published comparison point. UCSF Health chose a 10% threshold over the
# vendor's suggested 15% cutoff; these are its reported figures at 20%.
ucsf_benchmark:
  threshold: 0.20
  flag_rate: 0.121
  tpr: 0.595
  total_appointments: 808405
  implied_base_noshow_rate: 0.089
  source: "UCSF Health UserWeb, 2018"

hydra:
  run:
    dir: outputs/noshow_targeted_reminders/threshold_sweep/${now:%Y%m%d_%H%M%S}
  sweep:
    dir: outputs/noshow_targeted_reminders/threshold_sweep/sweep_${now:%Y%m%d_%H%M%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
