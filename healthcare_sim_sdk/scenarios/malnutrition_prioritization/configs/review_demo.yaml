# Public synthetic demonstration; no institutional targets or patient data.
purpose: Demonstrate review evidence and its limits, not certify a deployment.
horizon_days: 35
seeds: [11, 22, 33]
scenario:
  initial_census: 75
  admissions_per_day: 10
  rdn_assessments_per_day: 8
  true_prevalence: 0.3
  severity_score_gradient: 0.3
cells:
  - label: usual_care_identity
    overrides: {ml_enabled: false}
  - label: ranked_worklist
    overrides: {ml_enabled: true}
  - label: capacity_stress
    overrides: {ml_enabled: true, rdn_assessments_per_day: 2}
synthetic_model:
  d: 1.8
  kappa: 0.5
  h: 0.1
  theta_female: 0.2
  theta_black: 0.2
  theta_hl: 0.2
  delta_hard: 0.4
  scramble_scale: 0.2
  scramble_depth: 0.5
  map_a: 1.0
  map_b: -1.0
